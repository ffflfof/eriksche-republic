name: Auto-Update Flo's Notebook

on:
  push:
    branches:
      - main
    paths:
      - 'notebook/inbox/*.txt'

# Required so the GitHub Actions bot can commit the updated JSON and delete the .txt file
permissions:
  contents: write

jobs:
  build-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Notebook Parser Script
        run: python notebook/update_notebook.py

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add notebook/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(notebook): ingest new pages [skip ci]" && git push)