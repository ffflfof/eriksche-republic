name: Run Episode Compiler

on:
  push:
    branches: [ main ]
permissions: 
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run your custom compiler script
        run: python episode_helper.py

      - name: Automatically commit and push the updated HTML back to the site
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-compile episode [skip ci]" || exit 0
          git push
